[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexsym"
version = "0.1.0"
description = "Connectivity symmetry and dynamical motifs in multitask RNNs"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "six",
    "python-dotenv",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
# Connectome clients, needed only by flexsym.connectome / run.fetch_connectome.
# Kept optional so the RNN analyses do not acquire two API clients as hard deps.
connectome = [
    "neuprint-python>=0.6.3",
    "caveclient>=8.2.1",
]

# FixedPointFinder + recurrent-whisperer are NOT pip dependencies. They are
# vendored under external/ and reached via sys.path — see README.

[tool.setuptools.packages.find]
where = ["src"]
